          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserDTO'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                type: string
    put:
      tags:
        - user-rest-controller
      operationId: updateUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserDTO'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                type: string
    delete:
      tags:
        - user-rest-controller
      operationId: deleteUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserDTO'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                type: string
  /api/v1/users/:
    post:
      tags:
        - user-rest-controller
      operationId: createUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserFormDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                type: string
  '/api/v1/experiences/{id}/comments':
    get:
      tags:
        - experience-rest-controller
      operationId: getComments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommentSimpleDTO'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                type: string
    post:
      tags:
        - experience-rest-controller
      operationId: postComment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentFormDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CommentDTO'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                type: string
  /api/v1/experiences/:
    get:
      tags:
        - experience-rest-controller
      operationId: getExperiences
      parameters:
        - name: pageable
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Pageable'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PagedModelExperienceSimpleDTO'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                type: string
    post:
      tags:
        - experience-rest-controller
      operationId: createExperience
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperienceFormDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                type: string
  /api/v1/cities/:
    get:
      tags:
        - city-rest-controller
      operationId: getCities
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CitySimpleDTO'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                type: string
    post:
      tags:
        - city-rest-controller
      operationId: createCity
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CityFormDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CityDTO'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                type: string
  /api/v1/auth/refresh:
    post:
      tags:
        - auth-rest-controller
      operationId: refreshToken
      parameters:
        - name: RefreshToken
          in: cookie
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                type: string
  /api/v1/auth/logout:
    post:
      tags:
        - auth-rest-controller
      operationId: logOut
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                type: string
  /api/v1/auth/login:
    post:
      tags:
        - auth-rest-controller
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                type: string
  '/api/v1/users/{id}/experiences':
    get:
      tags:
        - user-rest-controller
      operationId: getExperiencesByUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExperienceSimpleDTO'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                type: string
  '/api/v1/users/{id}/comments':
    get:
      tags:
        - user-rest-controller
      operationId: getCommentsByUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommentSimpleDTO'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                type: string
  /api/v1/users/me:
    get:
      tags:
        - user-rest-controller
      operationId: getUserInfo
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserSimpleDTO'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                type: string
  /api/v1/tests/500:
    get:
      tags:
        - test-error-controller
      operationId: internalError
      responses:
        '200':
          description: OK
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                type: string
  '/api/v1/experiences/{id}':
    get:
      tags:
        - experience-rest-controller
      operationId: getExperienceById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ExperienceDTO'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                type: string
    delete:
      tags:
        - experience-rest-controller
      operationId: deleteExperienceById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ExperienceDTO'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                type: string
  /api/v1/experiences/categories:
    get:
      tags:
        - experience-rest-controller
      operationId: getCategories
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  type: string
                  enum:
                    - Accommodation
                    - Culture
                    - Documentation
                    - Gastronomy
                    - Personal_Experience
                    - Social_Events
                    - Studies
                    - Transportation
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                type: string
  '/api/v1/comments/{id}':
    delete:
      tags:
        - comment-rest-controller
      operationId: deleteCommentById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
