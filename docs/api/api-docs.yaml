components:
  schemas:
    CommentSimpleDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        date:
          type: string
          format: date
        description:
          type: string
        authorName:
          type: string
        experienceId:
          type: integer
          format: int64
    ExperienceSimpleDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        date:
          type: string
          format: date
        rating:
          type: number
          format: float
        title:
          type: string
        description:
          type: string
        categories:
          type: array
          items:
            type: string
            enum:
              - Accommodation
              - Culture
              - Documentation
              - Gastronomy
              - Personal_Experience
              - Social_Events
              - Studies
              - Transportation
        cityName:
          type: string
        country:
          type: string
        authorName:
          type: string
    UserDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        fullName:
          type: string
        displayName:
          type: string
        email:
          type: string
        studyLocation:
          type: string
        roles:
          type: array
          items:
            type: string
        experiences:
          type: array
          items:
            $ref: '#/components/schemas/ExperienceSimpleDTO'
        comments:
          type: array
          items:
            $ref: '#/components/schemas/CommentSimpleDTO'
    UserFormDTO:
      type: object
      properties:
        email:
          type: string
        displayName:
          type: string
        fullName:
          type: string
        city:
          type: string
        country:
          type: string
        password:
          type: string
        passwordConfirmation:
          type: string
    CommentFormDTO:
      type: object
      properties:
        description:
          type: string
    CommentDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        date:
          type: string
          format: date
        description:
          type: string
        author:
          $ref: '#/components/schemas/UserSimpleDTO'
        experience:
          $ref: '#/components/schemas/ExperienceSimpleDTO'
    UserSimpleDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        displayName:
          type: string
        email:
          type: string
    ExperienceFormDTO:
      type: object
      properties:
        rating:
          type: number
          format: float
        title:
          type: string
        description:
          type: string
        date:
          type: string
          format: date
        categories:
          type: array
          items:
            type: string
        cityId:
          type: integer
          format: int64
    CityFormDTO:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        country:
          type: string
    CityDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        country:
          type: string
        experiences:
          type: array
          items:
            $ref: '#/components/schemas/ExperienceSimpleDTO'
    AuthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - SUCCESS
            - FAILURE
        message:
          type: string
        error:
          type: string
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
    CitySimpleDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        country:
          type: string
    ExperienceDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        date:
          type: string
          format: date
        rating:
          type: number
          format: float
        title:
          type: string
        description:
          type: string
        categories:
          type: array
          items:
            type: string
            enum:
              - Accommodation
              - Culture
              - Documentation
              - Gastronomy
              - Personal_Experience
              - Social_Events
              - Studies
              - Transportation
        city:
          $ref: '#/components/schemas/CitySimpleDTO'
        author:
          $ref: '#/components/schemas/UserSimpleDTO'
        comments:
          type: array
          items:
            $ref: '#/components/schemas/CommentSimpleDTO'
    Pageable:
      type: object
      properties:
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
        sort:
          type: array
          items:
            type: string
    PageMetadata:
      type: object
      properties:
        size:
          type: integer
          format: int64
        number:
          type: integer
          format: int64
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
    PagedModelExperienceSimpleDTO:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ExperienceSimpleDTO'
        page:
          $ref: '#/components/schemas/PageMetadata'
