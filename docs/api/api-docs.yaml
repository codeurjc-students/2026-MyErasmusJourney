openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
  - url: 'http://localhost:8443'
    description: Generated server url
paths:
  '/api/v1/users/{id}':
    get:
      tags:
        - user-rest-controller
      operationId: getUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
